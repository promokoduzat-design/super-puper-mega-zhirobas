name: Finish requested cleanup
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-practice.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep required exercise files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" work -- --branch main
          cd work
          python3 - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          sources = {"main.py": "exercises/01-stash/main.py", "students.py": "exercises/01-stash/students.py", "app.py": "exercises/03-revert/app.py"}
          app = (root / sources["app.py"]).read_bytes()
          assert (root / "exercises/02-reset-soft/app.py").read_bytes() == app
          assert (root / "exercises/02-reset-mixed/app.py").read_bytes() == app
          for name, source in sources.items():
              assert not (root / name).exists()
              (root / name).write_bytes((root / source).read_bytes())
          Path("README.md").write_text("# супер пупер мега жиробас\n\n## 1.3\n\nОпция `-u` понадобилась, потому что `students.py` был новым неотслеживаемым файлом. Обычный `git stash` сохраняет изменения отслеживаемых файлов, а `-u` включает также неотслеживаемые файлы. После `git stash pop` изменения восстановлены.\n\n## 2.6\n\nПосле `git reset --soft HEAD~1` ветка указывает на первый коммит, а изменения второй версии остаются подготовленными к коммиту: режим `--soft` сохраняет индекс и рабочие файлы.\n\nПосле `git reset --mixed HEAD~1` ветка также указывает на первый коммит, но индекс возвращается к первой версии. Изменения второй версии остаются только в рабочем файле и не подготовлены к коммиту.\n\n## 2.7\n\nСтарый коммит остался в истории, потому что `git revert` не удаляет его, а создаёт новый коммит с обратными изменениями. После отмены третьего коммита в истории четыре коммита, а `app.py` содержит первую и вторую версии.\n", encoding="utf-8")
          Path(".gitattributes").write_text("* linguist-detectable=false\n", encoding="utf-8")
          PY
          git rm -r -- exercises logs
          git rm -- .gitignore REPORT.md results.json history.bundle git-practice-1_3-2_6-2_7.zip
          git add main.py students.py app.py README.md .gitattributes
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep only assignment code and answers'
          git push --atomic origin HEAD:refs/heads/main :refs/heads/exercise/2-6-soft-before :refs/heads/exercise/2-6-mixed-before
