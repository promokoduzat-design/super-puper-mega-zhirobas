name: Publish completed Git practice

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-practice.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish prepared files and original exercise commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" work -- --branch main
          cd work
          git bundle verify history.bundle
          git fetch "$PWD/history.bundle" 'refs/heads/*:refs/remotes/prepared/*'
          test "$(git rev-list --count refs/remotes/prepared/exercise/2-7-revert)" = 4
          git checkout refs/remotes/prepared/main -- README.md REPORT.md .gitignore exercises logs results.json git-practice-1_3-2_6-2_7.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish completed exercises and command logs'
          fi
          git fsck --full
          git push --atomic origin HEAD:refs/heads/main \
            refs/remotes/prepared/exercise/1-3-stash:refs/heads/exercise/1-3-stash \
            refs/remotes/prepared/exercise/2-6-soft-before:refs/heads/exercise/2-6-soft-before \
            refs/remotes/prepared/exercise/2-6-soft-after:refs/heads/exercise/2-6-soft-after \
            refs/remotes/prepared/exercise/2-6-mixed-before:refs/heads/exercise/2-6-mixed-before \
            refs/remotes/prepared/exercise/2-6-mixed-after:refs/heads/exercise/2-6-mixed-after \
            refs/remotes/prepared/exercise/2-7-revert:refs/heads/exercise/2-7-revert
          printf '%s\n' '## Completed' 'Published the report, exercise files, command logs and six original exercise branches.' >> "$GITHUB_STEP_SUMMARY"
